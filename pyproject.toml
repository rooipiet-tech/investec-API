[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invespend"
version = "0.1.0"
description = "Investec Programmable Banking ingestion + weekly Excel spend report"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "psycopg[binary]>=3.1",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
invespend = "invespend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
