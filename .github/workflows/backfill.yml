name: backfill

# Historical backfill of every accessible account, newest window first, stopping
# once history is exhausted (an empty-window streak across all accounts). Does a
# full re-pull to today — NOT --resume — so newly-granted accounts (e.g. call /
# cash-management) get their recent history, not just windows older than what is
# already stored. Run from the Actions tab → Run workflow.
on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date YYYY-MM-DD (blank = 25 years ago, i.e. full history)"
        required: false
        default: ""

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Resolve start date (default 25 years ago = full history)
        id: range
        run: |
          FROM="${{ github.event.inputs.from_date }}"
          FROM="${FROM:-$(date -u -d '25 years ago' +%Y-%m-%d)}"
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "Backfilling from $FROM"

      - name: Run backfill
        env:
          INVESTEC_CLIENT_ID: ${{ secrets.INVESTEC_CLIENT_ID }}
          INVESTEC_CLIENT_SECRET: ${{ secrets.INVESTEC_CLIENT_SECRET }}
          INVESTEC_API_KEY: ${{ secrets.INVESTEC_API_KEY }}
          INVESTEC_BASE_URL: ${{ secrets.INVESTEC_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: invespend ingest --from "${{ steps.range.outputs.from }}"
