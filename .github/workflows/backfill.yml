name: backfill

# Historical backfill. Defaults to 10 years; override the start date via the
# input below. Resumable: each run continues *older* than the data already
# stored, so if the API rate limit cuts a run short, just run it again until it
# stops finding older history. Run from the Actions tab → Run workflow.
on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date YYYY-MM-DD (blank = 25 years ago, i.e. full history)"
        required: false
        default: ""

# The token only checks out code; nothing in this job writes to the repo.
permissions:
  contents: read

# Shared with ingest.yml and weekly-report.yml: serializes every job that
# touches Postgres so a long backfill never overlaps the nightly ingest or the
# weekly backup and fights over locks.
concurrency:
  group: database
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Resolve start date (default 25 years ago = full history)
        id: range
        run: |
          FROM="${{ github.event.inputs.from_date }}"
          FROM="${FROM:-$(date -u -d '25 years ago' +%Y-%m-%d)}"
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "Backfilling from $FROM"

      - name: Run backfill
        env:
          INVESTEC_CLIENT_ID: ${{ secrets.INVESTEC_CLIENT_ID }}
          INVESTEC_CLIENT_SECRET: ${{ secrets.INVESTEC_CLIENT_SECRET }}
          INVESTEC_API_KEY: ${{ secrets.INVESTEC_API_KEY }}
          INVESTEC_BASE_URL: ${{ secrets.INVESTEC_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: invespend ingest --from "${{ steps.range.outputs.from }}" --resume --full
