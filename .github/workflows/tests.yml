name: tests

# Runs the test suite in the cloud on every PR and push — nothing to run locally.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

# The token only checks out code; nothing in these jobs writes to the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff (lint + import order)
        run: ruff check src/ tests/
      - name: Mypy (type check)
        run: mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A throwaway Postgres so the integration tests exercise the real schema,
    # migrations and views — not just the pure-Python units.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invespend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Drives the @pytest.mark.integration tests; unset elsewhere, so they skip.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invespend_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run pytest (unit + integration)
        run: pytest -q
