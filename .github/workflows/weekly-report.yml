name: weekly-report

# Builds the Excel spend analysis and the per-account bank statements, and
# emails them at the end of the week.
on:
  schedule:
    - cron: "0 15 * * 5"   # 15:00 UTC (17:00 SAST) every Friday
  workflow_dispatch: {}    # allow manual runs

permissions:
  contents: write   # for the heartbeat commit that keeps the cron alive

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REPORT_DATABASE_URL: ${{ secrets.REPORT_DATABASE_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REPORT_SENDER: ${{ secrets.REPORT_SENDER }}
      REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
      # Not needed by the report/statement jobs, but Settings.load() validates
      # them; provide harmless placeholders so they can run on their own.
      INVESTEC_CLIENT_ID: ${{ secrets.INVESTEC_CLIENT_ID }}
      INVESTEC_CLIENT_SECRET: ${{ secrets.INVESTEC_CLIENT_SECRET }}
      INVESTEC_API_KEY: ${{ secrets.INVESTEC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Build & email report
        run: invespend report --send

      - name: Build & email per-account statements
        run: invespend statements --send

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-spend-report
          path: reports/*.xlsx
          if-no-files-found: ignore
        continue-on-error: true

      # Supabase runs Postgres 17; the runner ships pg_dump 16, which refuses to
      # dump a newer server. Install the matching client so the backup works.
      - name: Install PostgreSQL 17 client (match Supabase server)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # pg_dump on PATH is the runner's v16; force the freshly-installed v17
          # binary ahead of it for subsequent steps.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Database backup (pg_dump → encrypted artifact)
        continue-on-error: true   # backup is best-effort; never fail the report job over it
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: invespend backup

      - name: Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backups/*
          retention-days: 30
          if-no-files-found: ignore
        continue-on-error: true

      - name: Heartbeat (keep scheduled workflows enabled)
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-run.txt
          git add .github/last-run.txt
          git commit -m "chore: weekly heartbeat [skip ci]" || exit 0
          git push
