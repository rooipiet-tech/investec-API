name: weekly-report

# Builds the Excel spend analysis and emails it at the end of the week.
on:
  schedule:
    - cron: "0 15 * * 5"   # 15:00 UTC (17:00 SAST) every Friday
  workflow_dispatch: {}    # allow manual runs

# Checks out code (read) and, on a failed scheduled run, files an alert issue.
# The heartbeat that keeps crons alive now lives in heartbeat.yml.
permissions:
  contents: read
  issues: write

# Shared with ingest.yml and backfill.yml: serializes every job that touches
# Postgres, so the report/backup never runs while an ingest or backfill holds
# locks (pg_dump in particular conflicts with migration DDL).
concurrency:
  group: database
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Build & email report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REPORT_DATABASE_URL: ${{ secrets.REPORT_DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_SENDER: ${{ secrets.REPORT_SENDER }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
        run: invespend report --send

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-spend-report
          path: reports/*.xlsx
          if-no-files-found: ignore
        continue-on-error: true

      # Supabase runs Postgres 17; the runner ships pg_dump 16, which refuses to
      # dump a newer server. Install the matching client so the backup works.
      - name: Install PostgreSQL 17 client (match Supabase server)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # pg_dump on PATH is the runner's v16; force the freshly-installed v17
          # binary ahead of it for subsequent steps.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Database backup (pg_dump → encrypted artifact)
        continue-on-error: true   # backup is best-effort; never fail the report job over it
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: invespend backup

      - name: Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backups/*
          retention-days: 30
          if-no-files-found: ignore
        continue-on-error: true

      - name: Alert on scheduled failure (open or append an issue)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="🔴 Scheduled weekly report is failing"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          num=$(gh issue list --state open --search "in:title $title" \
                  --json number,title \
                  --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Another failed run: $run_url ($(date -u +%FT%TZ))"
          else
            gh issue create --title "$title" \
              --body "The scheduled \`weekly-report\` workflow failed. Latest run: $run_url"
          fi
